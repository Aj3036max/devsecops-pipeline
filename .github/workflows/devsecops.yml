name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Principe du moindre privilège : le token GitHub n'a que la lecture par défaut.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devsecops-api

jobs:
  # 1. Qualité + tests unitaires
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  # 2. SAST : analyse statique du code
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit==1.9.4
      - run: bandit -r app wsgi.py -c pyproject.toml --severity-level medium

  # 3. SCA : vulnérabilités connues dans les dépendances
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --strict

  # 4. Détection de secrets commités (clés API, mots de passe...)
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique, pas seulement le dernier commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Lint du Dockerfile (bonnes pratiques CIS Docker)
  dockerfile:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # 6. Build de l'image + scan de vulnérabilités + SBOM, puis publication si tout est vert
  container:
    name: Build, scan & publish image
    needs: [test, sast, sca, secrets, dockerfile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire uniquement pour pousser sur GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Smoke test (conteneur non-root + healthcheck)
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(docker exec api id -u)" = "10001"
          docker rm -f api

      - name: Scan de vulnérabilités (Grype)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Push sur GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
