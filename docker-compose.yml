services:
  api:
    build: .
    image: devsecops-api:local
    ports:
      - "127.0.0.1:8000:8000"   # exposé uniquement en local
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-.env}
    read_only: true             # système de fichiers en lecture seule
    tmpfs:
      - /tmp
    cap_drop: [ALL]             # aucune capability Linux
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped
